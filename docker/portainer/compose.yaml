services:
    portainer:
        container_name: portainer
        image: portainer/portainer-ce:lts
        restart: always
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - portainer_data:/data
        ports:
            - 9443:9443
        networks:
            - newt_network

volumes:
    portainer_data:
        name: portainer_data

networks:
    newt_network:
        external: true
